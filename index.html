<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노숙인 무료급식 봉사 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#15a249">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="급식 봉사">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #f4f3ee; color: #1b231f;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  .wrap img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 6px 18px rgba(21, 162, 73, .25); }
  h1 { margin: 6px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  #msg { margin: 0; font-size: 15px; color: #6a726d; line-height: 1.5; max-width: 320px; }
  #msg.err { color: #b3261e; font-weight: 700; }
  .spin { width: 28px; height: 28px; border: 3px solid #d7e9dc; border-top-color: #15a249; border-radius: 50%;
    animation: r .9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  button { font: inherit; font-size: 16px; font-weight: 800; color: #fff; background: #15a249; border: 0;
    border-radius: 12px; padding: 13px 26px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <img src="icon-192.png" alt="">
  <h1>노숙인 무료급식 봉사 관리</h1>
  <div class="spin" id="spin" role="progressbar" aria-label="불러오는 중"></div>
  <p id="msg" role="status">불러오는 중…</p>
  <button type="button" id="retry" hidden>다시 시도</button>
</div>
<script>
// ▼ 웹앱 주소 (Apps Script → 배포 → 배포 관리에서 복사한 /exec 주소). 주소가 바뀌면 이 한 줄만 고치세요.
var API_URL = 'https://script.google.com/macros/s/AKfycbxuK2aUiKKyjaih5uTeE3Umbe0PXd1n3LlPqLTZBLiEiv7GCgrmnPSf2eGrM_VXcVXAig/exec';

// 이 페이지는 웹앱 화면 코드를 받아서 띄우기만 해요. 출석·명단 같은 자료는 여기 없고, 로그인한 뒤 웹앱에서만 오가요.
// 구글 로그인 정보를 보내지 않으니 브라우저에 구글 계정이 여러 개 로그인돼 있어도 열려요.
(function () {
  var msg = document.getElementById('msg'), spin = document.getElementById('spin'), retry = document.getElementById('retry');
  var HEAD = '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>노숙인 무료급식 봉사 관리</title>' +
    '<link rel="manifest" href="manifest.webmanifest">' +
    '<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">' +
    '<link rel="apple-touch-icon" href="apple-touch-icon.png">' +
    '<meta name="theme-color" content="#15a249">' +
    '<meta name="mobile-web-app-capable" content="yes">' +
    '<meta name="apple-mobile-web-app-capable" content="yes">' +
    '<meta name="apple-mobile-web-app-title" content="급식 봉사">' +
    '<script>window.__API_URL = ' + JSON.stringify(API_URL) + ';<\/script>';
  var slow, kill;
  function say(text, err) { msg.textContent = text; msg.className = err ? 'err' : ''; }
  function load() {
    retry.hidden = true; spin.hidden = false; say('불러오는 중…');
    clearTimeout(slow); clearTimeout(kill);
    slow = setTimeout(function () { say('조금 오래 걸리고 있어요…'); }, 6000);
    var ctl = window.AbortController ? new AbortController() : null;
    kill = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);
    fetch(API_URL + '?app=raw&t=' + Date.now(), { credentials: 'omit', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (html) {
        clearTimeout(slow); clearTimeout(kill);
        if (html.indexOf('id="loginForm"') < 0) throw new Error('NOTAPP');
        html = html.replace(/<head>/i, '<head>' + HEAD);
        document.open(); document.write(html); document.close();
      })
      .catch(function (e) {
        clearTimeout(slow); clearTimeout(kill);
        spin.hidden = true; retry.hidden = false;
        say(e && e.message === 'NOTAPP'
          ? '웹앱 주소가 바뀌었거나 배포 설정이 달라요. 관리자에게 알려 주세요.'
          : '연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.', true);
      });
  }
  retry.onclick = load;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  load();
})();
</script>
</body>
</html>
